name: CI automated backend test

on:
  push:
    branches: [ main, backend ]
  pull_request:
    branches: [ main ]

jobs:
  # job 1
  test-backend:
    runs-on: ubuntu-latest

    steps:
      - name: code checkout
        uses: actions/checkout@v4

      - name: setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: maven dependencies cache
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('back/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: running backend tests
        working-directory: ./back
        run: mvn clean test

  # job 2
  build-and-push:
    runs-on: ubuntu-latest
    needs: test-backend
    if: github.ref == 'refs/heads/main'

    steps: 
      - name: code checkout
        uses: actions/checkout@v4

      - name: login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: build backend image
        working-directory: ./back
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/solidarity-backend:latest .
          docker build -t ${{ secrets.DOCKER_USERNAME }}/solidarity-backend:${{ github.sha }} .

      - name: build frontend image
        working-directory: ./front
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/solidarity-frontend:latest .
          docker build -t ${{ secrets.DOCKER_USERNAME }}/solidarity-frontend:${{ github.sha }} .

      - name: push images to DockerHub
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/solidarity-backend:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/solidarity-backend:${{ github.sha }}
          docker push ${{ secrets.DOCKER_USERNAME }}/solidarity-frontend:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/solidarity-frontend:${{ github.sha }}