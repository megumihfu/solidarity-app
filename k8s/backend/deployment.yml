apiVersion: apps/v1
kind: Deployment
metadata:
  name: solidarity-backend
  namespace: solidarity
  labels:
    app: solidarity-backend
spec:
  replicas: 2
  
  selector:
    matchLabels:
      app: solidarity-backend
  template:
    metadata:
      labels:
        app: solidarity-backend
    spec:
      containers:
        - name: backend
          image: megumihfu/solidarity-backend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080

          env: 
            - name: DB_HOST
              valueFrom:
                secretKeyRef:
                  name: solidarity-secrets
                  key: DB_HOST

            - name: DB_PORT
              valueFrom:
                secretKeyRef:
                  name: solidarity-secrets
                  key: DB_PORT

            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: solidarity-secrets
                  key: DB_NAME

            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: solidarity-secrets
                  key: DB_USER

            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: solidarity-secrets
                  key: DB_PASSWORD

          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"