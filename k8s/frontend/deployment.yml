apiVersion: apps/v1
kind: Deployment
metadata:
  name: solidarity-frontend
  namespace: solidarity
  labels:
    app: solidarity-frontend

spec:
  replicas: 2

  selector:
    matchLabels:
      app: solidarity-frontend
    
  template:
    metadata:
      labels:
        app: solidarity-frontend

    spec:
      containers:
        - name: frontend
          image: megumihfu/solidarity-frontend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80

          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "200m"